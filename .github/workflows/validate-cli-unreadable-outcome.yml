name: Validate CLI unreadable write outcomes

on:
  push:
    branches:
      - validation/cli-unreadable-write-outcome-20261120

permissions:
  contents: read

jobs:
  cli:
    if: github.repository == 'Afloat16/linger'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9575a1e24ecbc26398c62137d3092b10c2cd8ac7
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Assert exact source revision
        run: test "$(git rev-parse HEAD)" = "9575a1e24ecbc26398c62137d3092b10c2cd8ac7"
      - name: Reproduce all four response failures without the fix
        shell: bash
        run: |
          set -euo pipefail
          git show cd0e23af6cacbca311bfe1964e11ea6c73cc7562:apps/teamhub-cli/src/http-client.ts > apps/teamhub-cli/src/http-client.ts
          status=0
          pnpm --filter @linger/teamhub-cli test src/http-client.test.ts -t 'retains the write operation ID after a successful status' --reporter=json --outputFile="$RUNNER_TEMP/cli-outcome-baseline.json" || status=$?
          git restore --source=9575a1e24ecbc26398c62137d3092b10c2cd8ac7 -- apps/teamhub-cli/src/http-client.ts
          test "$status" -ne 0
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/cli-outcome-baseline.json", "utf8"));
          const failures = report.testResults.flatMap((result) => result.assertionResults).filter((result) => result.status === "failed");
          if (report.numFailedTests !== 4 || failures.length !== 4 || failures.some((result) => !result.fullName.includes("retains the write operation ID"))) {
            throw new Error("Expected exactly the four unreadable response regressions to fail");
          }
          console.log("Baseline reproduced: all four unreadable write response regressions fail.");
          for (const result of failures) console.log(result.fullName, result.failureMessages.join("\n"));
          NODE
      - name: Focused HTTP client regression suite
        run: pnpm --filter @linger/teamhub-cli test src/http-client.test.ts
      - name: All selected fast checks
        run: make check BASE=cd0e23af6cacbca311bfe1964e11ea6c73cc7562
      - name: Repository contribution gate
        run: make check-repository-gate BASE=cd0e23af6cacbca311bfe1964e11ea6c73cc7562
      - name: Source remains unchanged
        if: always()
        run: |
          git diff --check
          git diff --exit-code
